# Aktualizacje zależności: akcje GitHub (przypięte do SHA - Dependabot
# podmienia SHA i komentarz z wersją), pakiety z uv.lock oraz obrazy bazowe
# Dockerfile'ów (przypięte do digestu) i wrangler Workera zgłoszeń
# (zgloszenia/package-lock.json).
#
# Sumy narzędzi pobieranych w workflow wydania i Dockerfile'ach
# (appimagetool, Inno Setup, minisign, Python NuGet) aktualizuje się ręcznie
# razem z wersją.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      akcje:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /packaging/docker
    schedule:
      interval: weekly
    groups:
      obrazy:
        patterns: ["*"]
    ignore:
      # Ubuntu 22.04 wyznacza najstarszą obsługiwaną glibc (patrz
      # linux.Dockerfile) - Dependabot odświeża tylko digest, nowsze wydania
      # zmienia się ręcznie razem z LINUX_GLIBC_BASELINE. Tag bookworm-slim
      # nie jest wersją, więc tu też zmienia się tylko digest.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /zgloszenia
    schedule:
      interval: weekly
    groups:
      worker:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      zaleznosci:
        patterns: ["*"]
    ignore:
      # PyAV 19 usunął argument metadata_errors, którego używa faster-whisper
      # (patrz komentarz przy "av" w pyproject.toml). Zdjąć po aktualizacji
      # faster-whisper, gdy przejdzie TestAudioDecodingContract.
      - dependency-name: av
        versions: [">=19"]
      # sherpa-onnx i sherpa-onnx-core muszą mieć tę samą wersję, a Dependabot
      # podbija je osobno - aktualizujemy je ręcznie, razem.
      - dependency-name: sherpa-onnx
      - dependency-name: sherpa-onnx-core
