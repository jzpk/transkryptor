# Aktualizacje zależności: akcje GitHub (przypięte do SHA - Dependabot
# podmienia SHA i komentarz z wersją) oraz pakiety z uv.lock.
#
# Sumy narzędzi pobieranych w workflow wydania i Dockerfile'ach
# (appimagetool, Inno Setup, minisign, Python NuGet) aktualizuje się ręcznie
# razem z wersją.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      akcje:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      zaleznosci:
        patterns: ["*"]
    ignore:
      # PyAV 19 usunął argument metadata_errors, którego używa faster-whisper
      # (patrz komentarz przy "av" w pyproject.toml). Zdjąć po aktualizacji
      # faster-whisper, gdy przejdzie TestAudioDecodingContract.
      - dependency-name: av
        versions: [">=19"]
      # sherpa-onnx i sherpa-onnx-core muszą mieć tę samą wersję, a Dependabot
      # podbija je osobno - aktualizujemy je ręcznie, razem.
      - dependency-name: sherpa-onnx
      - dependency-name: sherpa-onnx-core
