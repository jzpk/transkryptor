# Strona projektu na GitHub Pages: opis, pobieranie i historia zmian.
#
# Workflow „Wydanie” wywołuje go po publikacji wydania (z tagiem wydania
# w `ref`), bo wydanie i commit z [skip ci] nie uruchamiają innych
# workflow. Push nie wdraża strony - zmianę samej strony (pages/, generator)
# wdraża się ręcznie: Actions → „Strona” → Run workflow.
#
# Strona pokazuje najnowsze wydanie i jego historię zmian, a nie stan main
# (src/transkryptor/packaging/site.py). Environment github-pages musi
# dopuszczać gałąź main i tagi v* (Settings → Environments).
#
# Po wdrożeniu zgłoszenia strony (etykieta webpage) zamknięte jako zrobione
# przed początkiem budowania dostają etykietę „wdrożone” - strona statusu
# zgłoszeń pokazuje je jako wdrożone, a nie czekające na wydanie programu.
name: Strona

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag albo gałąź, z której powstaje strona"
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read

# Jedno wdrożenie naraz; rozpoczęte kończy się, nowsze czeka.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  budowanie:
    name: Budowanie strony
    runs-on: ubuntu-22.04
    outputs:
      start: ${{ steps.start.outputs.start }}
    steps:
      # Granica dla etykiety „wdrożone”: zgłoszenia zamknięte później mogą
      # nie być w budowanym kodzie.
      - id: start
        run: echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Instalacja uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Środowisko z uv.lock
        run: uv sync --locked

      - name: Generowanie strony
        # Formularz zgłoszeń (zglos.html): adres Workera i publiczny klucz
        # Turnstile ze zmiennych repozytorium REPORT_ENDPOINT i TURNSTILE_SITE_KEY.
        env:
          TRANSKRYPTOR_REPORT_ENDPOINT: ${{ vars.REPORT_ENDPOINT }}
          TRANSKRYPTOR_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: uv run python -m transkryptor.packaging.site --out _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  wdrozenie:
    name: Wdrożenie
    needs: budowanie
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - id: wdrozenie
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Błąd tutaj nie cofa wdrożenia; job można uruchomić ponownie (już
  # oznaczone zgłoszenia zostają bez zmian). Skrypt z bieżącego commita,
  # a nie z ref - starsze tagi go nie mają.
  etykiety:
    name: Etykiety wdrożonych zgłoszeń strony
    needs: [budowanie, wdrozenie]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Etykieta „wdrożone”
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOFF: ${{ needs.budowanie.outputs.start }}
        run: |
          PYTHONPATH=src python3 -m transkryptor.packaging.issue_labels \
            site --cutoff "$CUTOFF"
