# Kontrola jakości przy każdej zmianie: lint, formatowanie, typy, testy,
# audyt zależności i audyt samych workflow.
#
# Każdy przebieg sprawdza wszystko - także push na main ze scalenia PR
# (scalenie przez bypass rulesetu nie musiało mieć zielonych testów).
# Workflow „Wydanie” wywołuje ten plik (workflow_call) jako bramkę przed
# wydaniem, więc test albo podatność wykryta po ostatnim CI też je zatrzyma.
#
# Testy end-to-end (tests/e2e) nie biegną tutaj - zwykły pytest je pomija,
# a uruchamia je workflow wydania (release.yml). Cache uv jest wyłączony
# (zatrucie cache, zizmor: cache-poisoning). Akcje są przypięte do SHA
# commitów (aktualizuje je Dependabot, .github/dependabot.yml).
name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  jakosc:
    name: Ruff, black, mypy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalacja uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Środowisko z uv.lock
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

      - name: Black
        run: uv run black --check --diff .

      - name: Mypy
        run: uv run mypy

  testy:
    name: Testy
    runs-on: ubuntu-22.04
    # Zawieszony test (np. zakleszczenie Qt Multimedia) nie może blokować
    # runnera przez domyślne 6 godzin.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalacja uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Środowisko z uv.lock
        run: uv sync --locked

      # Testy UI działają w trybie offscreen (tests/ui/conftest.py), ale
      # wtyczka platformy Qt i tak linkuje się z tymi bibliotekami.
      # libpulse0: import PySide6.QtMultimedia (odtwarzacz audio).
      - name: Biblioteki systemowe Qt
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libpulse0

      # Test oznaczony asr_model wymaga pobranego modelu (1.53 GB). Próg
      # pokrycia to poziom z dnia wprowadzenia pomiaru (zaokrąglony w dół) -
      # podnosić, gdy rośnie, nie obniżać bez powodu.
      - name: Testy jednostkowe i integracyjne
        run: uv run pytest -m "not asr_model" --cov=transkryptor --cov-report=term --cov-fail-under=93
        env:
          QT_QPA_PLATFORM: offscreen

  testy-windows:
    name: Testy (Windows, bez Qt)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalacja uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Środowisko z uv.lock
        run: uv sync --locked

      # Moduły bez Qt, w których liczą się ścieżki, uprawnienia i nowe linie
      # Windows: projekt (relative_audio_path na innym dysku), DOCX,
      # notacja, aktualizacje (podpis, instalator), ustawienia.
      - name: Testy jednostkowe
        run: >-
          uv run pytest -m "not asr_model"
          tests/document tests/export tests/notation tests/update
          tests/test_i18n.py tests/test_settings_model.py tests/test_version.py

  zaleznosci:
    name: Znane podatności zależności
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalacja uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      # Wszystkie grupy (także narzędzia budowania wydania) z uv.lock, z hashami.
      - name: pip-audit
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.9.0 --strict --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"

  # actionlint: składnia, wyrażenia i shellcheck skryptów run:. zizmor:
  # audyt bezpieczeństwa (wstrzyknięcia, tokeny w .git/config, cache
  # w jobach wydania, nieprzypięte akcje). Wersje przypięte; ta sama
  # zasada co dla zależności - nie najnowsze z dnia publikacji.
  workflowy:
    name: Audyt workflow
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalacja uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: actionlint
        run: uvx --with shellcheck-py==0.11.0.1 --from actionlint-py==1.7.12.25 actionlint

      # Token tylko do odczytu: zizmor sprawdza przez API m.in. znane
      # podatności przypiętych akcji i SHA spoza ich repozytoriów.
      - name: zizmor
        run: uvx zizmor@1.32.0 --format=github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
