# Kontrola jakości przy każdej zmianie: lint, formatowanie, typy i testy.
#
# Push na main ze scalenia PR nie powtarza lintu ani testów - ten sam kod
# przeszedł je już w PR (job „scalony-pr”). Audyt zależności działa zawsze,
# bo nowe podatności pojawiają się niezależnie od kodu. Bezpośredni push na
# main jest sprawdzany w całości.
#
# Workflow wydania (release.yml) powtarza te same kontrole przed budowaniem
# artefaktów - tag nie ominie bramki. Akcje są przypięte do SHA commitów
# (aktualizuje je Dependabot, .github/dependabot.yml).
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Commit wypchnięty na main, który jest commitem scalenia PR (merge, squash
  # albo ostatni commit rebase), pomija lint i testy. Błąd API nie pomija
  # niczego - kontrole wtedy się wykonują.
  scalony-pr:
    name: Scalenie PR
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pominac: ${{ steps.sprawdzenie.outputs.pominac }}
    steps:
      - id: sprawdzenie
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numer=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$GITHUB_SHA\")][0].number // empty" \
            || true)
          if [ -n "$numer" ]; then
            echo "Commit $GITHUB_SHA to scalenie PR #$numer - kontrole przeszły w PR."
            echo "pominac=true" >> "$GITHUB_OUTPUT"
          else
            echo "pominac=false" >> "$GITHUB_OUTPUT"
          fi

  jakosc:
    name: Ruff, black, mypy
    needs: scalony-pr
    if: needs.scalony-pr.outputs.pominac != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalacja uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Środowisko z uv.lock
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

      - name: Black
        run: uv run black --check --diff .

      - name: Mypy
        run: uv run mypy

  testy:
    name: Testy
    needs: scalony-pr
    if: needs.scalony-pr.outputs.pominac != 'true'
    runs-on: ubuntu-22.04
    # Zawieszony test (np. zakleszczenie Qt Multimedia) nie może blokować
    # runnera przez domyślne 6 godzin.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalacja uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Środowisko z uv.lock
        run: uv sync --locked

      # Testy UI działają w trybie offscreen (tests/ui/conftest.py), ale
      # wtyczka platformy Qt i tak linkuje się z tymi bibliotekami.
      # libpulse0: import PySide6.QtMultimedia (odtwarzacz audio).
      - name: Biblioteki systemowe Qt
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libpulse0

      # Test oznaczony asr_model wymaga pobranego modelu (1.53 GB). Próg
      # pokrycia to poziom z dnia wprowadzenia pomiaru (zaokrąglony w dół) -
      # podnosić, gdy rośnie, nie obniżać bez powodu.
      - name: Testy jednostkowe i integracyjne
        run: uv run pytest -m "not asr_model" --cov=transkryptor --cov-report=term --cov-fail-under=93
        env:
          QT_QPA_PLATFORM: offscreen

  testy-windows:
    name: Testy (Windows, bez Qt)
    needs: scalony-pr
    if: needs.scalony-pr.outputs.pominac != 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalacja uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Środowisko z uv.lock
        run: uv sync --locked

      # Moduły bez Qt, w których liczą się ścieżki, uprawnienia i nowe linie
      # Windows: projekt (relative_audio_path na innym dysku), DOCX,
      # notacja, aktualizacje (podpis, instalator), ustawienia.
      - name: Testy jednostkowe
        run: >-
          uv run pytest -m "not asr_model"
          tests/document tests/export tests/notation tests/update
          tests/test_i18n.py tests/test_settings_model.py tests/test_version.py

  zaleznosci:
    name: Znane podatności zależności
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalacja uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Wszystkie grupy (także narzędzia budowania wydania) z uv.lock, z hashami.
      - name: pip-audit
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.9.0 --strict --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"
